name: Build book

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out book
        uses: actions/checkout@v6

      - name: Prepare chapters and edition metadata
        shell: bash
        run: |
          mkdir -p build
          chapters=(
            01-the-early-days.md
            02-the-cost-of-convenience.md
            03-building-something-bigger.md
            04-epilogue-the-madness-continues.md
          )

          : > build/book.md
          for chapter in "${chapters[@]}"; do
            if [[ -s build/book.md ]]; then
              printf '\n\\newpage\n\n' >> build/book.md
            fi
            # Remove GitHub-only chapter navigation.
            sed '/\[↑ Contents\]/d' "$chapter" >> build/book.md
            printf '\n' >> build/book.md
          done

          published="$(date -u +%Y-%m-%d)"
          edition="Development"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            edition="${GITHUB_REF#refs/tags/}"
            printf '%s\n' "# Edition" "" "Title: Anime Automation Madness" "" "Author: SuperMiaw" "" "Version: $edition" "" "Published: $published" "" "License: Creative Commons Attribution 4.0 International (CC BY 4.0)" >> build/book.md
          fi

          # Use the same footer for development builds and tagged editions.
          # Redefine the plain page style too (used on chapter-opening pages).
          {
            printf '%s\n' '\usepackage{fancyhdr}'
            printf '%s\n' '\pagestyle{fancy}' '\fancyhf{}'
            printf '%s\n' '\fancyfoot[C]{\thepage}'
            printf '%s\n' '\fancyfoot[L]{Anime Automation Madness -- SuperMiaw}'
            printf '\fancyfoot[R]{%s -- %s -- CC BY 4.0}\n' "$edition" "$published"
            printf '%s\n' '\renewcommand{\headrulewidth}{0pt}'
            printf '%s\n' '\fancypagestyle{plain}{\fancyhf{}\fancyfoot[C]{\thepage}\fancyfoot[L]{Anime Automation Madness -- SuperMiaw}\fancyfoot[R]{'"$edition"' -- '"$published"' -- CC BY 4.0}\renewcommand{\headrulewidth}{0pt}}'
            # Pandoc's LaTeX template calls \tableofcontents for the PDF.
            printf '%s\n' '\let\originaltableofcontents\tableofcontents'
            printf '%s\n' '\renewcommand{\tableofcontents}{\originaltableofcontents\clearpage}'
          } > build/footer.tex

      - name: Generate EPUB and PDF
        shell: bash
        run: |
          common=(
            --standalone --toc --toc-depth=2
            --metadata title="Anime Automation Madness"
            --metadata subtitle="From a Few Scripts to a Big System"
            --metadata author="SuperMiaw"
            --metadata lang="en"
          )

          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/data" -w /data pandoc/latex:latest \
            "${common[@]}" --split-level=1 \
            -o build/anime-automation-madness.epub build/book.md

          pdf_args=(--include-in-header=build/footer.tex)
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/data" -w /data pandoc/latex:latest \
            "${common[@]}" "${pdf_args[@]}" \
            -o build/anime-automation-madness.pdf build/book.md

      - name: Upload latest development build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: anime-automation-madness-latest
          path: |
            build/anime-automation-madness.epub
            build/anime-automation-madness.pdf
          retention-days: 7
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/anime-automation-madness.epub
            build/anime-automation-madness.pdf
          fail_on_unmatched_files: true
