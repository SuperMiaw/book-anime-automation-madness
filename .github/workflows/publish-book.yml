name: Build book

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out book
        uses: actions/checkout@v4

      - name: Prepare chapters
        shell: bash
        run: |
          mkdir -p build/chapters
          for chapter in 0[1-4]-*.md; do
            sed '/\[↑ Contents\]/d' "$chapter" > "build/chapters/$chapter"
          done

      - name: Generate EPUB and PDF
        shell: bash
        run: |
          chapters=(
            build/chapters/01-the-early-days.md
            build/chapters/02-the-cost-of-convenience.md
            build/chapters/03-building-something-bigger.md
            build/chapters/04-epilogue-the-madness-continues.md
          )
          for format in epub pdf; do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$PWD:/data" -w /data \
              pandoc/latex:latest \
              --standalone --toc --toc-depth=2 \
              --metadata title="Anime Automation Madness" \
              --metadata subtitle="From a Few Scripts to a Big System" \
              --metadata author="SuperMiaw" \
              --metadata lang="en" \
              -o "build/anime-automation-madness.$format" \
              "${chapters[@]}"
          done

      - name: Upload latest development build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: anime-automation-madness-latest
          path: |
            build/anime-automation-madness.epub
            build/anime-automation-madness.pdf
          retention-days: 7
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/anime-automation-madness.epub
            build/anime-automation-madness.pdf
          fail_on_unmatched_files: true
